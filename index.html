<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>블렌더 단축키 복습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: one calm column, one question per screen, big tap targets. White ground only (owner 2026-11-14) — single light theme by choice. */
:root{
  --ground:#ffffff; --ink:#1d2329; --soft:#5d6873; --line:#e3e8ee; --panel:#f4f7fa;
  --accent:#e87d0d;           /* Blender orange */
  --accent-ink:#9a4f00; --accent-wash:#fff3e6;
  --ok:#1f8a4c; --ok-wash:#e8f6ee; --again:#b0541e; --again-wash:#fdf0e8;
  --menu-bg:#2d2f33; --menu-ink:#e9e9e9;
  --key-top:#ffffff; --key-edge:#c9d0d8; --key-shadow:#aeb7c1;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-key:"JetBrains Mono","Noto Sans KR",ui-monospace,Consolas,monospace;
  --base:19px;
  color-scheme:light;
}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--base);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:1.05em;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:.68em;color:var(--soft);letter-spacing:0}
.size{display:flex;gap:6px}
.size button{min-width:48px;min-height:44px;border:1px solid var(--line);background:var(--ground);border-radius:10px;font-weight:700;font-size:.8em}
.note{font-size:.78em;color:var(--soft);background:var(--panel);border-radius:10px;padding:10px 14px;margin:0}
.note b{color:var(--ink)}
h1{font-size:1.5em;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.45em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.72em;color:var(--soft)}
.big{display:block;width:100%;min-height:64px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:1.1em;padding:14px}
.big.alt{background:var(--ground);color:var(--ink);border:2px solid var(--ink)}
.big[disabled]{opacity:.45;cursor:default}
.ghost{border:0;background:none;color:var(--soft);text-decoration:underline;text-underline-offset:4px;min-height:48px;font-size:.85em}
.sect{font-size:.78em;font-weight:700;color:var(--soft);letter-spacing:.04em;margin-top:6px}
/* category board */
.cats{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.catrow{display:grid;grid-template-columns:2.1em minmax(0,1fr) 3.6em;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--ground);padding:12px 2px;min-height:60px}
.catrow .cn{width:1.9em;height:1.9em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-wash);color:var(--accent-ink);font-weight:900;font-size:.85em;font-variant-numeric:tabular-nums}
.catrow .ct{min-width:0}
.catrow .ct b{display:block;font-size:.95em}
.catrow .ct span{font-size:.72em;color:var(--soft)}
.catrow .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--accent)}
.catrow.soon{opacity:.55;cursor:default}
.outs{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.outs summary{cursor:pointer;color:var(--soft);font-weight:700;padding:6px 0}
.orow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.orow b{flex:1;min-width:8em}
/* card rows inside a category */
.cards{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.crow{border-bottom:1px solid var(--line)}
.crow > button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--ground);padding:10px 0;min-height:56px}
.crow .nm{min-width:0;display:flex;flex-direction:column;gap:4px}
.crow .nm b{font-size:.92em}
.crow .nm .sub{font-size:.72em;color:var(--soft)}
.crow .tok kbd{font-size:.74em}
.crow .tok .menu{font-size:.66em}
.crow .detail{padding:0 0 14px}
.boxes{display:flex;gap:3px}
.boxes i{width:9px;height:14px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--accent)}
.tag{font-size:.7em;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ok-wash);color:var(--ok);white-space:nowrap}
.tag.new{background:var(--panel);color:var(--soft)}
/* family box — 앞 키 뜻 · 가족 */
.fam{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.fam .ft{font-weight:900;font-size:.92em}
.fam .fd{font-size:.78em;color:var(--soft)}
.fam ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fam li{display:flex;align-items:center;gap:10px;font-size:.82em;flex-wrap:wrap}
.fam li .tok kbd{font-size:.8em}
.fam .fx{font-size:.72em;color:var(--again)}
/* tokens: keycaps, menu names, numbers */
.tok{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.keys{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.keys .plus{font-weight:700;color:var(--soft)}
.tok .keys{gap:5px}
kbd{font-family:var(--f-key);font-weight:800;display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;padding:0 .45em;
  background:var(--key-top);border:1px solid var(--key-edge);border-radius:.32em;box-shadow:0 .14em 0 var(--key-shadow);font-size:1em;line-height:1;white-space:nowrap}
.tok.huge{justify-content:center}
.tok.huge kbd{font-size:2.1em}
.tok.huge .menu{font-size:1.25em}
.tok.huge .numtok{font-size:1.9em}
.tok.huge .pick{font-size:1.2em}
.tok.mid kbd{font-size:1.15em}
.then{display:inline-flex;align-items:center;gap:6px}
.then em{font-style:normal;color:var(--soft);font-weight:700}
.pick{font-family:var(--f-key);font-weight:700;font-size:.82em;border:2px dashed var(--accent);color:var(--accent-ink);background:var(--ground);border-radius:6px;padding:2px 8px;white-space:nowrap}
.ctx{font-size:.66em;color:var(--soft);font-weight:500}
.numtok{font-family:var(--f-key);font-weight:800;color:var(--accent-ink);background:var(--accent-wash);border-radius:8px;padding:2px 10px;white-space:nowrap}
.choice .numtok,.fb .numtok,.crow .numtok,.orow .numtok,.step .numtok{white-space:normal}  /* 긴 메뉴 이름(Extrude Faces Along Normals)·긴 시험 키가 칸 밖으로 안 나가게 */
/* menu path like Blender's dark menu */
.menu{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-key);font-weight:600;font-size:.78em}
.menu span{background:var(--menu-bg);color:var(--menu-ink);padding:4px 9px;border-radius:5px}
.menu em{font-style:normal;color:var(--soft)}
/* question screen */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.75em;color:var(--soft)}
.chip{font-size:.72em;font-weight:700;color:var(--accent-ink);background:var(--accent-wash);padding:3px 10px;border-radius:99px;white-space:nowrap}
.prompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.prompt .ask{font-size:1.2em;font-weight:700;text-wrap:balance}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;border:2px solid var(--line);background:var(--ground);border-radius:14px;padding:10px 16px;font-weight:700}
.choice.right{border-color:var(--ok);background:var(--ok-wash)}
.choice.wrongpick{border-color:var(--again);background:var(--again-wash)}
.choice[disabled]{cursor:default}
/* assemble (눌러서 맞히기) */
.asm{display:flex;flex-direction:column;gap:10px}
.asl{font-size:.75em;font-weight:700;color:var(--soft);margin:4px 0 0}
.asl .pick{font-size:1em}
.mods,.lets{display:grid;gap:8px}
.mods{grid-template-columns:repeat(3,1fr)}
.lets{grid-template-columns:repeat(2,1fr)}
.mk,.lk,.tk{min-height:58px;border:2px solid var(--line);background:var(--ground);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:6px}
.mk kbd,.lk kbd{font-size:1.05em}
.mk.on,.lk.on,.tk.on{border-color:var(--accent);background:var(--accent-wash)}
.mk.right,.lk.right,.tk.right{border-color:var(--ok);background:var(--ok-wash)}
.built{min-height:2.6em;display:flex;align-items:center;justify-content:center;border:1px dashed var(--key-edge);border-radius:12px;padding:6px;font-size:.9em;color:var(--soft)}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-wash)} .fb.again{background:var(--again-wash)}
.fb .head{font-weight:900}
.fb.ok .head{color:var(--ok)} .fb.again .head{color:var(--again)}
.fb p{margin:0;font-size:.88em}
.fb .why{color:var(--soft)}
.fb p .tok{vertical-align:middle;gap:4px}
.fb p kbd{font-size:.9em}
/* intro (new card) */
.intro{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.step .lb{font-size:.72em;font-weight:700;color:var(--soft);padding-top:.25em}
.step .vl{min-width:0}
.step .fam{background:var(--ground)}
.en{font-family:var(--f-key);font-weight:600;color:var(--soft);font-size:.85em}
.back{border:1px solid var(--line);background:var(--ground);border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;font-size:.8em}
.navrow{display:flex;gap:8px;justify-content:space-between}
.navrow .back{flex:1}
.loading{color:var(--soft);text-align:center;padding:40px 0}
/* 말로 풀기 · 소리 (2026-11-14) */
.tools{display:flex;gap:8px}
.tools button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--ground);border-radius:10px;font-weight:700;font-size:.78em;padding:0 10px}
.tools button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--accent-ink)}
.vline{margin:0;font-size:.74em;color:var(--soft);background:var(--panel);border-radius:10px;padding:8px 12px;border:0;width:100%;text-align:left}
.vline.live{color:var(--accent-ink);background:var(--accent-wash)}
.choice .no{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--panel);color:var(--soft);font-size:.8em;font-weight:900}
@media (prefers-reduced-motion:no-preference){.fb,.intro,.prompt{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="brand">블렌더 단축키 복습<small>메뉴 기능 + 단축키 · 블렌더 10분류 · 뱀부 3분류 · 108장 · 메뉴 이름 필기</small></div>
    <div class="size"><button id="fsm" aria-label="글씨 작게">가−</button><button id="fsp" aria-label="글씨 크게">가+</button></div>
  </div>
  <div class="tools"><button id="mic" aria-pressed="false">🎤 말로 풀기 꺼짐</button><button id="snd" aria-pressed="false">🔕 소리 꺼짐</button></div>
  <button class="vline" id="vline" hidden></button>
  <div id="view"><p class="loading">진도를 불러오는 중이에요…</p></div>
</div>

<script>
/* ===== 카드 재료 =====
   키·메뉴 경로: 블렌더 5.2 blender_default.py · space_view3d.py 로 확인 (2026-11-14).
   ⑨ 숫자: 3d-print 스킬 references/tolerances.md (FDM 일반값).
   ⑪~⑬ 뱀부: 연습/뱀부/뱀부-01~31 연습.json 의 키·자리(실물 시험 통과분)만 · 영어 이름은 Bambu Studio resources/i18n/ko/BambuStudio.mo 대조 (2026-11-14).
   kind: key(기본) · mouse · menu(메뉴·칸 이름) · num(숫자) · word(말). then = 앞 키로 연 메뉴에서 고를 것. */
const CATS = [
 {n:1, name:"화면과 길 찾기", tip:"마우스 가운데 휠과 숫자패드로 보는 자리 바꾸기"},
 {n:2, name:"실수 돌이키기·안전", tip:"망쳐도 괜찮게 — 되돌리기·저장·숨기기·mm 단위"},
 {n:3, name:"고르기·만들기·지우기", tip:"무엇을 고르고, 새로 만들고, 합치고, 지우나"},
 {n:4, name:"옮기기·돌리기·키우기", tip:"G · R · S 세 키와 그 가족"},
 {n:5, name:"N 칸 숫자로 정확히", tip:"눈대중 말고 mm 숫자로 — N 칸 Item 탭"},
 {n:6, name:"편집 모드", tip:"Tab 으로 들어가서 점·선·면 고치기"},
 {n:7, name:"모디파이어", tip:"모양을 망가뜨리지 않고 효과 얹기 — 렌치 탭"},
 {n:8, name:"출력 전 검사·내보내기", tip:"뽑기 전에 꼭 보는 것"},
 {n:9, name:"키링·케이스 숫자 규칙", tip:"프린터로 뽑으면 달라지는 숫자. 3D 출력 공차표의 일반값이라 프린터·재료마다 실물로 한 번 확인해요"},
 {n:10, name:"글자 (이름 키링)", tip:"이름 키링 만들 때 나오는 것"},
 {n:11, name:"뱀부 단축키", tip:"뱀부 스튜디오 준비 화면에서 누르는 키. A · N 은 블렌더와 하는 일이 달라요"},
 {n:12, name:"뱀부 오른쪽 클릭·도구 줄", tip:"물체를 오른쪽 클릭하거나 도구 줄에서 여는 것"},
 {n:13, name:"뱀부 설정 어느 탭에", tip:"왼쪽 「프로세스」 탭(품질 · 강도 · 속도 · 서포트 · 기타) 어디에 있나. 못 찾으면 🔍 에 이름을 쳐요"},
 {n:14, name:"연습 시험 · 많이 쓰는 키부터", tip:"PC 🧊 3D 연습(기초·중급) 시험 문제예요. 여러 연습에 자주 나오는 키부터 하루 몇 장씩 다른 카드와 섞여 나와요. 할 일을 보고 누를 키를 골라요"},
 {n:15, name:"메뉴 이름 · 필기", tip:"블렌더 화면의 영어 메뉴·칸 이름. 하는 일을 보고 영어 이름을 골라요 — 보기는 헷갈리는 같은 무리끼리 나와요"},
];
const CARDS = [
 /* ① 화면과 길 찾기 */
 {id:"n", cat:1, keys:["N"], ko:"옆 서랍 열고 닫기", en:"Sidebar", task:"치수(mm)를 숫자로 넣는 옆 서랍을 열려면?", mode:"3D 화면 위에서",
  why:"Item 탭의 Dimensions(치수)에 mm를 숫자로 정확히 넣을 때", where:["View","Sidebar"], origin:"외우는 꾀: N = Number(숫자) 넣는 서랍", near:["np7","home","tab"]},
 {id:"wheel", cat:1, kind:"mouse", keys:["휠 굴리기"], ko:"가까이·멀리 보기", en:"Zoom", task:"화면을 가까이 당겨 크게 보려면?", mode:"3D 화면 위에서",
  why:"구멍 가장자리를 크게 보고 확인할 때", where:["마우스 가운데 휠"], origin:"휠 = 돋보기. 앞으로 굴리면 가까이", near:["mmb","smmb","npdot"]},
 {id:"mmb", cat:1, kind:"mouse", keys:["휠 누른 채 끌기"], ko:"빙 돌려 보기", en:"Orbit", task:"물체 둘레를 돌아가며 보려면?", mode:"3D 화면 위에서",
  why:"키링 뒷면까지 빙 돌려 볼 때", where:["마우스 가운데 휠을 꾹 누른 채 끌기"], origin:"손으로 물체를 잡고 돌리는 느낌", near:["wheel","smmb","np1"]},
 {id:"smmb", cat:1, kind:"mouse", keys:["Shift","휠 누른 채 끌기"], ko:"화면 옆으로 밀기", en:"Pan", task:"화면을 위아래·옆으로 밀어 옮기려면?", mode:"3D 화면 위에서",
  why:"물체가 화면 구석에 있을 때 가운데로 끌어올 때", where:["Shift 누른 채 가운데 휠 끌기"], origin:"Shift 를 더하면 돌리기 대신 밀기", near:["mmb","wheel","home"]},
 {id:"np1", cat:1, keys:["숫자패드 1"], ko:"앞에서 보기", en:"Front View", task:"물체를 정면(앞)에서 보려면?", mode:"3D 화면 위에서",
  why:"네임택 글자가 똑바로 섰는지 앞에서 볼 때", where:["View","Viewpoint","Front"], origin:"1 앞 · 3 오른쪽 · 7 위. Ctrl 을 같이 누르면 반대쪽(뒤·왼쪽·아래)", near:["np3","np7","npdot"]},
 {id:"np3", cat:1, keys:["숫자패드 3"], ko:"오른쪽에서 보기", en:"Right View", task:"물체를 오른쪽 옆에서 보려면?", mode:"3D 화면 위에서",
  why:"판 두께가 3mm 맞는지 옆에서 볼 때", where:["View","Viewpoint","Right"], origin:"1 앞 · 3 오른쪽 · 7 위. Ctrl 을 같이 누르면 반대쪽(뒤·왼쪽·아래)", near:["np1","np7","home"]},
 {id:"np7", cat:1, keys:["숫자패드 7"], ko:"위에서 내려다보기", en:"Top View", task:"물체를 위에서 내려다보려면?", mode:"3D 화면 위에서",

/*SRS-START — 일정 규칙(복습설계안 §4 · learning-principles §2). 순수 함수만. */
const SRS = (() => {
  const INTERVALS = [0,1,3,7,14,30,60];   // 상자 1→1일, 2→3일, 3→7일, 4→14일, 5→30일, 6→60일 (제안값)
  const NEW_PER_DAY = 5, BACKLOG_PAUSE = 30, GAPS = [1,3,Infinity];
  const addDays = (day,n) => { const d = new Date(day+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  const blank = () => ({box:0,due:null,okDays:[],right:0,wrong:0,graded:null,intro:null});
  // 하루 첫 답만 일정을 바꾼다. 처음 배운 날은 무조건 상자 1 · 내일.
  function grade(st, ok, today){
    const s = {...st, okDays:[...(st.okDays||[])]};
    if (ok) s.right++; else s.wrong++;
    if (s.intro === today){ s.box = 1; s.due = addDays(today,1); s.graded = today; return s; }
    if (s.graded === today) return s;
    if (ok){ s.box = Math.min(s.box+1,6); s.due = addDays(today, INTERVALS[s.box]); if(!s.okDays.includes(today)) s.okDays.push(today); }
    else { s.box = 1; s.due = addDays(today,1); }
    s.graded = today; return s;
  }
  const learned = st => (st.okDays||[]).length >= 3;
  const isDue = (st,today) => st.box>0 && st.due && st.due <= today;
  // 회차 안: 새 카드·틀린 카드는 1장 뒤 → 약 3장 뒤 → 맨 끝. 연달아 내지 않음.
  function reinsert(queue, entry){
    const gap = GAPS[Math.min(entry.attempt-1, GAPS.length-1)];
    const q = queue.slice();
    if (gap === Infinity || gap >= q.length) q.push(entry); else q.splice(Math.max(1,gap), 0, entry);
    return q;
  }
  return {INTERVALS, NEW_PER_DAY, BACKLOG_PAUSE, addDays, blank, grade, learned, isDue, reinsert};
})();
/*SRS-END*/

function setPicked(){ // PC 연습 전부의 시험 문제 → ⑭ 카드 (11-15 19:27 「중급도 · 초급 포함 · 자주 쓰는 거 위주로」). 한 방향(시험 글 → 키) · ⑭ 안에서 같은 키는 한 번 · 키 아닌 단계·문제 없는 단계는 뺌
  // 순서 = 많은 연습에 나오는 키 먼저 → 같으면 PC에서 해 본 것 → 기초 → 중급. 같은 키가 여러 연습에 있으면 이미 배우기 시작한 카드(id)를 그대로 살린다
  for (let i=CARDS.length-1;i>=0;i--) if (CARDS[i].cat===PICK_CAT){ delete BY[CARDS[i].id]; CARDS.splice(i,1); }
  for (let i=ITEM_IDS.length-1;i>=0;i--) if (!BY[ITEM_IDS[i].split(".")[0]]) ITEM_IDS.splice(i,1);
  const cand = {}, order = [];
  Object.entries(EXTRA).filter(([k,v])=>k.startsWith("pk.") && v && v.on && v.test).sort(([,a],[,b])=>(a.at||0)-(b.at||0)).forEach(([k,v])=>{
    const seen = new Set();
    (v.steps||[]).forEach((st,i)=>{
      const n = keyNorm(st.k);
      if (!/[a-z0-9]/.test(n) || !st.m || seen.has(n)) return; seen.add(n);
      if (!cand[n]){ cand[n] = []; order.push(n); }
      cand[n].push({k, v, st, i, id:"p"+k.slice(3)+"s"+i});
    });
  });
  const lvRank = l => l==="기초" ? 0 : l==="중급" ? 2 : 1;
  const rows = order.map((n,o)=>{
    const cs = cand[n], begun = cs.find(c=>items[c.id+".f"] && items[c.id+".f"].box>0);
    const pick = begun || cs.slice().sort((a,b)=>lvRank(a.v.lv)-lvRank(b.v.lv))[0];
    return {n, o, pick, freq:cs.length, done:cs.some(c=>(c.v.n||0)>0), lv:Math.min(...cs.map(c=>lvRank(c.v.lv)))};
  }).sort((a,b)=>b.freq-a.freq || (a.freq===1 ? a.lv-b.lv : 0) || (b.done-a.done) || (a.lv-b.lv) || (a.o-b.o));   // 한 연습에만 나오는 키는 기초 → 중급 순
  rows.forEach(({pick:{k,v,st,i,id}, freq, done})=>{
    const raw = String(st.k).replace(/\s+/g," ").trim(), isKey = !raw.includes("→") && raw.includes("+");
    const keys = isKey ? raw.split("+").map(x=>x.trim()).filter(Boolean) : [raw];
    let task = st.m; // 할 일 글에 답 키가 그대로 있으면 □ 로 가린다
    keys.join(" ").split(/[\s+→]+/).filter(t=>/^[A-Za-z0-9]+$/.test(t)).forEach(t=>{ task = task.replace(new RegExp(`(^|[^A-Za-z0-9])${t}(?![A-Za-z0-9])`,"g"), "$1□"); });
    const lvName = v.lv==="중급" ? "중급 " : v.lv==="기초" ? "기초 " : "";
    const c = {id, cat:PICK_CAT, one:true, keys, kind:isKey?"key":"word", ko:st.m, en:v.name||"", task:task+" — 어떻게 하나요?", mode:"시험 · "+(v.name||""),
      why:`${lvName}연습 「${v.name||""}」 ${i+1}단계`, where:[v.name||"", `${i+1}단계`],
      origin:(freq>1 ? `연습 ${freq}개에 나오는 키예요` : "이 연습에만 나오는 키예요") + (done ? " · PC에서 해 봤어요" : ""), near:[], pcN:v.n||0, freq,
      band: freq>=5 ? "자주 나오는 키 · 연습 5개 넘게" : freq>=2 ? "가끔 나오는 키 · 연습 2~4개" : "한 연습에만 · " + (v.lv||"그 밖")};
    CARDS.push(c); BY[id] = c; dirsOf(c).forEach(d=>{ ITEM_IDS.push(id+"."+d); if(!items[id+"."+d]) items[id+"."+d] = SRS.blank(); });
  });
}
function applyExtra(){
  PCREC = (EXTRA["pc.rec"] && EXTRA["pc.rec"].rec) || {};
  const o = EXTRA["x.out"]; OUT = o ? {at:o.at||0, ids:Array.isArray(o.ids)?o.ids:[]} : {at:0, ids:[]};
  setPicked();
}
const isOut = c => OUT.ids.includes(c.id);
const liveCards = () => CARDS.filter(c=>!isOut(c));
const liveIds = () => ITEM_IDS.filter(id=>!OUT.ids.includes(id.split(".")[0]));
const pcCount = c => c.cat===PICK_CAT ? c.pcN : PCREC[c.id];

function readRemoteCfg(){
  try{
    const h = location.hash.slice(1);
    if (h.includes("s=") && h.includes("t=")){
      const p = new URLSearchParams(h), url = p.get("s"), token = p.get("t");
      if (url && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url) && token){ safe("bk.remote",{url,token}); history.replaceState(null,"",location.pathname+location.search); }
    }
  }catch(e){}
  const r = safe("bk.remote");
  if (r && r.url && r.token) REMOTE = r;
  else if (REMOTE_DEFAULT.url && REMOTE_DEFAULT.token) REMOTE = REMOTE_DEFAULT;
}
function queuePut(kind,id,body){
  outbox = outbox.filter(x=>!(x.kind===kind && x.id===id)); outbox.push({kind,id,body});
  safe("bk.outbox", outbox); scheduleFlush();
}
let flushT = null, flushing = false;
function scheduleFlush(){ clearTimeout(flushT); flushT = setTimeout(flush, 1200); }
async function flush(){
  if (flushing || !outbox.length || !REMOTE) return;
  flushing = true; const batch = outbox.slice(0,40);
  try{
    const r = await fetch(REMOTE.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({token:REMOTE.token, puts:batch}), redirect:"follow"});
    const j = await r.json();
    if (j && j.ok){ outbox = outbox.filter(x=>!batch.includes(x)); safe("bk.outbox", outbox); if (where==="sheet-off") where = "sheet"; }
  }catch(e){}
  flushing = false;
  if (outbox.length) flushT = setTimeout(flush, 15000);
}

async function load(){
  EXTRA = safe("bk.extra") || {}; applyExtra();
  ITEM_IDS.forEach(id=>items[id]=SRS.blank());
  const li = safe("bk.items"), ld = safe("bk.days");
  if (li) Object.keys(li).forEach(k=>{ if(items[k]) items[k] = {...SRS.blank(), ...li[k]}; });
  if (ld) days = ld;
  const timeout = () => new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000));
  try{ db = await (window.claude?.use ? window.claude.use("db") : null); }catch(e){ db = null; }
  if (db){
    try{
      const [is, ds] = await Promise.race([Promise.all([db.collection("items").get(), db.collection("days").get()]), timeout()]);
      is.docs.forEach(d=>{ const v=d.data(); if(v && v.item && isExtraId(v.item)) EXTRA[v.item] = v; }); applyExtra();
      is.docs.forEach(d=>{ const v=d.data(); if(v && v.item && items[v.item]) items[v.item] = {...SRS.blank(), ...v}; });
      ds.docs.forEach(d=>{ days[d.id] = d.data(); });
      where = "db"; cacheLocal(); return;
    }catch(e){ db = null; }
  }
  readRemoteCfg();
  if (!REMOTE){ where = "local"; return; }
  try{
    const j = await Promise.race([fetch(REMOTE.url+"?op=read&token="+encodeURIComponent(REMOTE.token), {redirect:"follow"}).then(r=>r.json()), timeout()]);
    if (!j || !j.ok) throw j;
    const ri = j.items || {}, rd = j.days || {};
    Object.keys(EXTRA).forEach(k=>{ if (k!=="x.out" && !ri[k]) delete EXTRA[k]; });     // PC 줄은 시트가 정본
    Object.keys(ri).filter(isExtraId).forEach(k=>{ if (k==="x.out" && (EXTRA[k]?.at||0) > (ri[k].at||0)) return; EXTRA[k] = ri[k]; });
    if (EXTRA["x.out"] && (!ri["x.out"] || (EXTRA["x.out"].at||0) > (ri["x.out"].at||0))) queuePut("items","x.out",EXTRA["x.out"]);
    applyExtra(); safe("bk.extra", EXTRA);
    Object.entries(ri).forEach(([k,v])=>{ if(!items[k]) return; const loc = items[k]; if (!loc.at || (v.at||0) >= loc.at) items[k] = {...SRS.blank(), ...v}; else queuePut("items",k,{...loc,item:k}); });
    Object.keys(items).forEach(k=>{ if (items[k].at && !ri[k]) queuePut("items",k,{...items[k],item:k}); });
    Object.entries(rd).forEach(([d,v])=>{ const loc = days[d]; if (!loc || (v.answered||0) >= (loc.answered||0)) days[d] = v; else queuePut("days",d,loc); });
    Object.keys(days).forEach(d=>{ if (!rd[d]) queuePut("days",d,days[d]); });
    where = "sheet"; cacheLocal(); flush();
  }catch(e){ where = "sheet-off"; if (outbox.length) scheduleFlush(); }
}
let writing = Promise.resolve();
function saveItem(id){
  items[id] = {...items[id], at:Date.now()};
  const body = {...items[id], item:id};
  cacheLocal();
  if (where==="db") writing = writing.then(()=>db.doc("items/"+docId(id)).set(body)).catch(()=>{});
  else if (REMOTE) queuePut("items", id, body);
}
function toggleOut(cid){ // 복습에서 빼기 ↔ 되돌리기 — 일정은 그대로 두고 문제·숫자에서만 뺀다
  const s = new Set(OUT.ids); s.has(cid) ? s.delete(cid) : s.add(cid);
  const body = {item:"x.out", at:Date.now(), ids:[...s]};
  EXTRA["x.out"] = body; applyExtra(); safe("bk.extra", EXTRA);
  if (where==="db") writing = writing.then(()=>db.doc("items/x_out").set(body)).catch(()=>{});
  else if (REMOTE) queuePut("items", "x.out", body);
}
let dayDirty = false;
function saveDay(){
  const d = today(); if(!dayDirty) return; dayDirty = false;
  const body = {...days[d]};
  cacheLocal();
  if (where==="db") writing = writing.then(()=>db.doc("days/"+d).set(body)).catch(()=>{});
  else if (REMOTE) queuePut("days", d, body);
}
function storeNote(){
  const n = outbox.length;
  if (where==="db") return "진도는 클로드에 저장돼요.";
  if (where==="sheet") return "진도는 구글시트에 저장돼요. 폰·PC 어디서 열어도 이어져요."+(n?` (보내는 중 ${n}개)`:"");
  if (where==="sheet-off") return `지금은 구글시트에 닿지 않아 이 기기에 먼저 적어 둬요. 연결되면 저절로 보내요.${n?` (보낼 기록 ${n}개)`:""}`;
  return "진도는 이 기기에 저장돼요.";
}

/* ===== 소리 — 맞힘 = 올라가는 두 음 · 틀림 = 낮은 한 음 (2026-11-14 사장님 「틀리거나 맞추면 다르게」)
   밤 8시~아침 8시엔 처음에 꺼짐(기억 feedback_no_sound_night). 밤에 켠 것은 그 밤만, 끈 것은 계속 꺼짐. */
const SOUND = (() => {
  let ac = null;
  const night = () => { const h = new Date().getHours(); return h>=20 || h<8; };
  const nightKey = () => { const d = new Date(); if (d.getHours()<8) d.setDate(d.getDate()-1); return d.toDateString(); };
  const isOn = () => { const p = safe("bk.snd"); if (p && p.v==="off") return false; if (p && p.v==="on") return !night() || p.n===nightKey(); return !night(); };
  const ctx = () => { try{ ac ||= new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==="suspended") ac.resume(); }catch(e){ ac = null; } return ac; };
  const tone = (f, t0, d, type) => { const a = ctx(); if (!a) return; const t = a.currentTime+t0, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.03); };
  const btn = document.getElementById("snd");
  const draw = () => { const on = isOn(); btn.textContent = on ? "🔔 소리 켜짐" : "🔕 소리 꺼짐"; btn.setAttribute("aria-pressed", String(on)); };
  btn.onclick = () => { if (isOn()) safe("bk.snd",{v:"off"}); else { safe("bk.snd",{v:"on", n: night()?nightKey():null}); ctx(); tone(784,0,.12,"sine"); } draw(); };
  document.addEventListener("pointerdown", () => { if (isOn()) ctx(); }, {once:true}); // 폰은 한 번 눌러야 소리가 열림
  draw();
  return { ok(){ if (!isOn()) return; tone(784,0,.14,"sine"); tone(1047,.12,.22,"sine"); },
           no(){ if (!isOn()) return; tone(196,0,.34,"triangle"); }, isOn };
})();

/* ===== 말로 풀기 — 폰 크롬 음성 인식(ko-KR). 문제가 뜨면 저절로 듣는다.
   알아듣는 말: 「1번·첫 번째」 같은 번호 · 보기 글 그대로 · 키 이름 소리(「지」→G) · 「모르겠어」 · 「다음」·「알겠어」 */
const VOICE = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const WORDS = { "add modifier":"애드모디파이어", "control":"컨트롤", "ctrl":"컨트롤", "shift":"시프트", "alt":"알트", "tab":"탭", "home":"홈",
    "modifier":"모디파이어", "array":"어레이", "bevel":"베벨", "mirror":"미러", "solidify":"솔리디파이", "extrude":"익스트루드", "union":"유니온",
    "difference":"디퍼런스", "dimensions":"디멘션", "dimension":"디멘션", "location":"로케이션", "rotation":"로테이션", "scale":"스케일", "units":"유닛",
    "statistics":"스태티스틱스", "export":"익스포트", "face":"페이스", "orientation":"오리엔테이션", "non":"논", "manifold":"매니폴드", "set":"셋",
    "origin":"오리진", "convert":"컨버트", "mesh":"메시", "all":"올", "transforms":"트랜스폼", "by":"바이", "distance":"디스턴스", "at":"앳",
    "center":"센터", "selection":"셀렉션", "material":"머티리얼", "text":"텍스트", "cursor":"커서", "to":"투", "selected":"셀렉티드" };
  const LETTER = { a:"에이", b:"비", c:"씨", d:"디", e:"이", f:"에프", g:"지", h:"에이치", i:"아이", j:"제이", k:"케이", l:"엘", m:"엠", n:"엔", o:"오",
    p:"피", q:"큐", r:"알", s:"에스", t:"티", u:"유", v:"브이", w:"더블유", x:"엑스", y:"와이", z:"제트" };
  const SAME = [[/쥐|쮜/g,"지"],[/쉬프트|쉽트|쉬프트/g,"시프트"],[/콘트롤|컨트로/g,"컨트롤"],[/애이/g,"에이"],[/에치|에이취|에취/g,"에이치"],[/아르|알르/g,"알"],
    [/에쓰|에스으/g,"에스"],[/엑쓰|액스/g,"엑스"],[/제드|젯트|젯/g,"제트"],[/메쉬/g,"메시"],[/트랜스폼스/g,"트랜스폼"],[/유닛스/g,"유닛"],[/디멘션스|디멘전/g,"디멘션"],
    [/스테티스틱스/g,"스태티스틱스"],[/플러스|더하기/g,""]];
  const norm = s => { let t = " "+String(s).toLowerCase().replace(/[→+·,.!?~]/g," ")+" ";
    Object.keys(WORDS).sort((a,b)=>b.length-a.length).forEach(w => { t = t.replace(new RegExp(`(^|[^a-z])${w}(?=[^a-z]|$)`,"g"), (m,p)=>p+WORDS[w]); });
    t = t.replace(/[a-z]/g, c => LETTER[c]);
    SAME.forEach(([re,to]) => { t = t.replace(re,to); });
    return t.replace(/[^가-힣0-9]/g,""); };
  const tail = t => t.replace(/(이에요|예요|입니다|이요|요)$/,"");
  const NUM = [["1","1번","일번","첫번째","첫번","첫째","하나","하나요"],["2","2번","이번","두번째","두번","둘째","둘"],["3","3번","삼번","세번째","세번","셋째","셋"],["4","4번","사번","네번째","네번","넷째","넷"]];
  const bigr = s => { const o = []; for (let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; };
  const dice = (a,b) => { if (a===b) return 1; if (a.length<2 || b.length<2) return 0; const A = bigr(a), B = bigr(b); let n = 0; const left = [...B];
    A.forEach(x => { const i = left.indexOf(x); if (i>=0){ n++; left.splice(i,1); } }); return 2*n/(A.length+B.length); };
  const score = (t,f) => { if (!f) return 0; if (t===f) return 1; let s = dice(t,f); if (t.length>=2 && f.startsWith(t)) s = Math.max(s, .6+.4*t.length/f.length); if (f.length>=2 && t.includes(f)) s = Math.max(s,.9); return s; };

  // 한 번 들은 말(후보 여러 개) → 어느 단추인지
  function decide(alts, c){
    for (const raw of alts){
      const t = norm(raw), tt = tail(t);
      if (!t) continue;
      if (c.idk && /모르|몰라|정답보|패스/.test(t)) return {el:c.idk, said:raw};
      if (c.next && /^(다음|넘어|계속|오케이|알겠|알았|네|응|좋아)/.test(t)) return {el:c.next, said:raw};
      if (c.choices){
        const bare = c.choices.findIndex(x => x.forms.includes(tt));            // 보기 글과 꼭 같으면 그것
        if (bare>=0) return {el:c.choices[bare].el, said:raw};
        const n = NUM.findIndex(fs => fs.includes(tt));                          // 「2번」 = 두 번째 보기
        if (n>=0 && c.choices[n]) return {el:c.choices[n].el, said:raw};
        const sc = c.choices.map(x => Math.max(...x.forms.map(f => score(tt,f)))), best = Math.max(...sc), i = sc.indexOf(best);
        const second = Math.max(-1, ...sc.filter((_,j)=>j!==i));
        if (best>=.6 && best-second>=.12) return {el:c.choices[i].el, said:raw};
      }
    }
    return null;
  }

  let on = !!safe("bk.mic") && !!SR, rec = null, live = false, scope = null, cmds = null, tries = 0;
  const btn = document.getElementById("mic"), line = document.getElementById("vline");
  const say = (txt, isLive) => { line.hidden = !txt; line.textContent = txt||""; line.classList.toggle("live", !!isLive); };
  const draw = () => { btn.textContent = on ? "🎤 말로 풀기 켜짐" : "🎤 말로 풀기 꺼짐"; btn.setAttribute("aria-pressed", String(on)); if (!on) say(""); };
  const alive = () => on && cmds && scope && scope.isConnected;
  function start(){
    if (!alive() || live) return;
    try{
      rec = new SR(); rec.lang = "ko-KR"; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
      rec.onresult = ev => { const alts = [...ev.results[0]].map(a => a.transcript); handle(alts); };
      rec.onerror = ev => { if (ev.error==="not-allowed" || ev.error==="service-not-allowed"){ on = false; safe("bk.mic",false); draw();
        say("마이크가 막혀 있어요. 주소창 왼쪽 자물쇠 → 마이크 「허용」 뒤 🎤 를 다시 눌러 주세요."); }
        else if (ev.error==="audio-capture"){ on = false; safe("bk.mic",false); draw(); say("마이크를 못 찾았어요. 이 기기는 손으로 눌러 주세요."); } };
      rec.onend = () => { live = false; if (!alive()) return; if (tries<4){ tries++; setTimeout(start,300); } else say("🎤 쉬는 중 — 여기를 누르면 다시 들어요"); };
      rec.start(); live = true; say(cmds.hint, true);
    }catch(e){ live = false; }
  }
  function handle(alts){
    if (!cmds) return;
    const hit = decide(alts, cmds);
    if (hit){ say(`들은 말: 「${alts[0]}」`); tries = 0; hit.el.click(); }
    else say(`「${alts[0]}」 — 못 알아들었어요. 「1번」처럼 번호로 말해 주세요`, true);
  }
  // 화면마다 부른다. c = {choices:[{el,forms}], idk, next, hint} · null 이면 이 화면은 손으로만
  function listen(c){
    scope = $view.firstElementChild; cmds = c; tries = 0;
    if (!on) return;
    if (!c){ try{ rec && rec.abort(); }catch(e){} say("🎤 이 문제는 손으로 눌러서 풀어요"); return; }
    if (live){ say(c.hint, true); return; }   // 듣는 중이면 끝난 뒤 새 화면 것으로 이어 들음
    setTimeout(start, 450);                    // 맞힘·틀림 소리가 마이크에 안 들어가게 조금 뒤
  }
  btn.onclick = () => {
    if (!SR){ say("이 브라우저는 말 인식이 안 돼요. 안드로이드 크롬에서 돼요."); return; }
    on = !on; safe("bk.mic", on); draw();
    if (on){ tries = 0; if (cmds) start(); else say("🎤 문제가 뜨면 들어요", true); } else { try{ rec && rec.abort(); }catch(e){} }
  };
  line.onclick = () => { if (on && cmds){ tries = 0; start(); } };
  draw();
  window.__voice = alts => handle([].concat(alts));   // 시험용: 들은 말을 글자로 넣어 본다
  return { listen, norm, decide };
})();

/* ===== 화면 도우미 ===== */
const $view = document.getElementById("view");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kindOf = c => c.kind || "key";
const keysHtml = (keys,cls="") => `<span class="keys ${cls}">${keys.map(k=>`<kbd>${esc(k)}</kbd>`).join('<span class="plus">+</span>')}</span>`;
function tokHtml(c, size=""){
  const k = kindOf(c);
  const core = k==="menu" ? `<span class="menu"><span>${esc(c.keys[0])}</span></span>`
    : (k==="num" || k==="word" || k==="term") ? `<span class="numtok">${esc(c.keys[0])}</span>`
    : keysHtml(c.keys);
  const th = c.then ? `<span class="then"><em>→</em><span class="pick">${esc(c.then)}</span></span>` : "";
  const ctx = c.ctx ? `<span class="ctx">${esc(c.ctx)}</span>` : "";
  return `<span class="tok ${size}">${core}${th}${ctx}</span>`;
}
const tokText = c => c.keys.join("+") + (c.then ? "→"+c.then : "") + (c.ctx||"");
const LBL = {key:"단축키", mouse:"마우스", menu:"메뉴 이름", num:"숫자", word:"말", term:"블렌더 화면 글자"};
const WHERE_LBL = {key:"메뉴 자리", mouse:"하는 법", menu:"메뉴 자리", num:"자세히", word:"하는 법", term:"무리"};
const ASK_K = {key:"이 키를 누르면?", mouse:"마우스로 이렇게 하면?", menu:"이 메뉴·칸은 무엇을 하나요?", num:"이 숫자는 어떤 규칙?", word:"이 말은 무슨 뜻?"};
const menuHtml = c => `<div class="menu">${c.where.map(w=>`<span>${esc(w)}</span>`).join("<em>›</em>")}</div>`;
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const uniq = a => [...new Set(a)];
const dayRec = () => (days[today()] ||= {secs:0,answered:0,correct:0,wrongs:[]});
const boxOf = c => Math.min(...dirsOf(c).map(d=>items[c.id+"."+d].box));
const learnedCard = c => dirsOf(c).every(d=>SRS.learned(items[c.id+"."+d]));
const boxesHtml = b => `<span class="boxes" title="상자 ${b}">${[1,2,3,4,5,6].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span>`;
function famHtml(f, here){
  return `<div class="fam"><div class="ft">${esc(f.title)}</div><div class="fd">${esc(f.desc)}</div>
    <ul>${f.members.map(id=>BY[id]).map(m=>`<li>${tokHtml(m)}<span>${m.id===here?"<b>":""}${esc(m.ko)}${m.id===here?"</b>":""}</span></li>`).join("")}</ul>
    ${f.ex?`<div class="fx">${esc(f.ex)}</div>`:""}</div>`;
}

function weekSums(){
  const t = today(); let tw=0, lw=0;
  for (let i=0;i<14;i++){ const d=SRS.addDays(t,-i); const r=days[d]; if(!r) continue; if(i<7) tw+=r.correct||0; else lw+=r.correct||0; }
  return {tw,lw};
}
function counts(){
  const t = today();
  const due = liveIds().filter(id=>SRS.isDue(items[id],t)).length;
  const introToday = liveCards().filter(c=>items[headId(c)].intro===t).length;
  const fresh = liveCards().filter(c=>items[headId(c)].box===0).length;
  const paused = due > SRS.BACKLOG_PAUSE;
  const newToday = paused ? 0 : freshList(Math.max(0, SRS.NEW_PER_DAY - introToday)).length;
  return {due,newToday,fresh,paused};
}
function mixPick(list){ // ⑭ 연습 시험 카드를 다른 카드와 하나씩 번갈아 (많이 쓰는 키가 다른 분류 뒤로 밀리지 않게 · 11-15 19:27)
  const p = list.filter(c=>c.cat===PICK_CAT), o = list.filter(c=>c.cat!==PICK_CAT), r = [];
  for (let i=0; i<Math.max(p.length,o.length); i++){ if (o[i]) r.push(o[i]); if (p[i]) r.push(p[i]); }
  return r;
}
function freshList(n){ // 새 카드 고르기 — 단축키 카드 날 · 낱말 날 번갈아(오늘 이미 배운 게 있으면 그 쪽 그대로). 낱말은 같은 무리 3~5개 묶어 소개(learning-principles §2)
  const fresh = liveCards().filter(c=>items[headId(c)].box===0);
  const words = fresh.filter(c=>c.cat===WORD_CAT), others = fresh.filter(c=>c.cat!==WORD_CAT);
  if (!words.length || !others.length || n<=0) return mixPick(fresh).slice(0, Math.max(0,n));
  let last = null; liveCards().forEach(c=>{ const d = items[headId(c)].intro; if (d && (!last || d>last)) last = d; });
  const lastWord = !!last && liveCards().some(c=>c.cat===WORD_CAT && items[headId(c)].intro===last);
  const wordDay = last===today() ? lastWord : !lastWord;
  if (!wordDay) return mixPick(others).slice(0,n);
  const rem = words.filter(c=>c.mode===words[0].mode).length;   // 지금 무리에 남은 낱말
  const take = rem<=n ? rem : (rem-n<3 ? Math.ceil(rem/2) : n);  // 남은 게 1~2개로 쪼개지지 않게
  return words.slice(0, Math.min(take,n));
}

/* ===== 첫 화면 ===== */

    ${paused ? `<p class="note">복습이 ${due}문제 밀려 있어서 오늘은 새 카드를 쉬어요.</p>` : ""}

    <div class="sect">분류별 공부 · 하나 골라 훑어보고 그 분류만 풀어요</div>
    <div class="cats">${cats}</div>

  document.getElementById("go").onclick = () => nothing ? startMore() : startToday();

/* ===== 분류 화면 ===== */
function catView(n){
  const ct = CATS.find(x=>x.n===n), cs = liveCards().filter(c=>c.cat===n), outs = CARDS.filter(c=>c.cat===n && isOut(c));

    <div class="sect">카드 ${cs.length}장 · 누르면 펼쳐져요</div>

    ${outs.length ? `<details class="outs"><summary>뺀 카드 ${outs.length}장 · 복습에 안 나와요</summary>${outs.map(c=>`<div class="orow">${tokHtml(c)}<b>${esc(c.ko)}</b><button class="ghost" data-back="${c.id}">되돌리기</button></div>`).join("")}</details>` : ""}

/* ===== 회차 ===== */
let HIST = [], CUR = null;  // 지나간 카드(뒤로 보기용) · 지금 화면
const backBtn = () => HIST.length ? `<button class="back" id="bk">← 뒤로</button>` : "";
function bindBack(){ const b=document.getElementById("bk"); if(b) b.onclick=()=>peek(HIST.length-1); }
function remember(id){ if(HIST[HIST.length-1]!==id) HIST.push(id); if(HIST.length>30) HIST.shift(); }
function cardInfo(c, withFam=true){ const k = kindOf(c); return `
    <div class="step"><div class="lb">쓰는 까닭</div><div class="vl">${esc(c.why)}</div></div>
    <div class="step"><div class="lb">이름 뜻</div><div class="vl"><b>${esc(c.ko)}</b> <span class="en">${esc(c.en)}</span>${c.gloss?`<div style="font-size:.85em;color:var(--soft)">${esc(c.gloss)}</div>`:""}</div></div>
    <div class="step"><div class="lb">${WHERE_LBL[k]}</div><div class="vl">${menuHtml(c)}</div></div>
    <div class="step"><div class="lb">${LBL[k]}</div><div class="vl">${tokHtml(c,"mid")}<div style="font-size:.85em;color:var(--soft);margin-top:6px">${esc(c.origin)}</div></div></div>
    ${pcCount(c)!=null ? `<div class="step"><div class="lb">PC에서 해 봄</div><div class="vl"><b>${pcCount(c)}번</b> <span style="font-size:.85em;color:var(--soft)">${pcCount(c) ? "블렌더·뱀부 연습에서 이 키를 쓴 횟수" : "이 키가 나오는 PC 연습을 아직 안 했어요"}</span></div></div>` : ""}
    ${withFam ? famsOf(c.id).map(f=>`<div class="step"><div class="lb">가족</div><div class="vl">${famHtml(f,c.id)}</div></div>`).join("") : ""}`; }
function peek(pos){ // 뒤로: 지난 카드 설명을 다시 본다. 일정은 안 바뀜.
  const c = BY[HIST[pos]];
  if (CUR && CUR.t==="q" && CUR.item.startsWith(c.id+".")) CUR.peeked = true;
  $view.innerHTML = `
  <div class="wrap intro">
    <div class="qhead"><span class="chip">지난 카드 ${pos+1} / ${HIST.length}</span><span>${esc(c.mode)}</span></div>
    ${cardInfo(c)}
    <div class="navrow">${pos>0?`<button class="back" id="pv">← 더 뒤로</button>`:""}${pos<HIST.length-1?`<button class="back" id="nf">앞으로 →</button>`:""}</div>
    <button class="big" id="rt">하던 ${CUR&&CUR.t==="intro"?"설명":"문제"}으로 돌아가기</button>
  </div>`;
  const pv=document.getElementById("pv"), nf=document.getElementById("nf");
  if(pv) pv.onclick=()=>peek(pos-1); if(nf) nf.onclick=()=>peek(pos+1);
  document.getElementById("rt").onclick=()=>{ CUR.t==="intro" ? intro(CUR,true) : ask(CUR); };
}
let S = null;  // {queue, mode:'today'|'more'|'wrong'|'cat', activeMs, lastTick, answered, correct, wrongSet, cat}
function buildToday(){
  const t = today(), {newToday} = counts();
  const due = shuffle(liveIds().filter(id=>SRS.isDue(items[id],t))).sort((a,b)=>items[a].due.localeCompare(items[b].due));
  const fresh = freshList(newToday);
  const q = []; let fi = 0;
  due.forEach((id,i)=>{ q.push({t:"q",item:id,need:1,attempt:0,practice:false}); if(i%2===1 && fi<fresh.length) q.push({t:"intro",card:fresh[fi++].id}); });
  while(fi<fresh.length) q.push({t:"intro",card:fresh[fi++].id});
  return separate(q);
}
function separate(q){ // 같은 카드의 두 방향이 붙지 않게
  for(let i=1;i<q.length;i++){ const a=q[i-1], b=q[i]; if(a.t==="q"&&b.t==="q"&&a.item.split(".")[0]===b.item.split(".")[0]){ const j=q.findIndex((x,k)=>k>i && !(x.t==="q"&&x.item.split(".")[0]===a.item.split(".")[0])); if(j>0){ [q[i],q[j]]=[q[j],q[i]]; } } }
  return q;
}
function begin(queue, mode, cat){
  S = {queue, mode, cat, activeMs:0, lastTick:Date.now(), answered:0, correct:0, wrongSet:new Set()};
  next();
}
function startToday(){ begin(buildToday(),"today"); }
function startMore(){
  let q = S && S.queue.length ? S.queue : buildToday();
  if (!q.length){ // 남은 게 없으면: 새 카드 더 → 아니면 미리 한 번 더
    const fresh = freshList(SRS.NEW_PER_DAY);
    if (fresh.length) q = fresh.map(c=>({t:"intro",card:c.id}));
    else q = separate(shuffle(liveIds()).sort((a,b)=>items[a].box-items[b].box).slice(0,12).map(id=>({t:"q",item:id,need:1,attempt:0,practice:true})));
  }
  begin(q,"more");
}
function startWrong(ids){ begin(separate(shuffle(ids).map(id=>({t:"q",item:id,need:1,attempt:0,practice:true}))),"wrong"); }
function startCat(n){ // 분류 공부: 처음 카드는 설명부터(오늘 배운 카드로 일정에 들어감), 아는 카드는 연습(일정 안 바뀜)
  const cs = liveCards().filter(c=>c.cat===n);
  const intros = cs.filter(c=>items[headId(c)].box===0).map(c=>({t:"intro",card:c.id}));
  const known = shuffle(cs.filter(c=>items[headId(c)].box>0).flatMap(c=>dirsOf(c).map(d=>({t:"q",item:c.id+"."+d,need:1,attempt:0,practice:true}))));
  begin(separate([...intros, ...known]), "cat", n);
}

function tick(){ // 화면을 보고 있는 시간만 센다(한 문제에 2분 넘게 멈춰 있으면 2분까지만)
  const now = Date.now(); S.activeMs += Math.min(now - S.lastTick, 120000); S.lastTick = now;
}
function bankDay(){ // 이번 회차 시간 중 아직 날짜 줄에 안 넣은 만큼 넣고 바로 보낸다 (2026-11-15 — 「끝」 화면 전에 나가도 그날 줄이 남게)
  if(!S) return; tick();
  const s = Math.round(S.activeMs/1000), r = dayRec();
  r.secs = (r.secs||0) + s - (S.bankedS||0); S.bankedS = s;
  dayDirty = true; saveDay();
}
function beaconOut(){ // 화면이 숨겨지면 타이머가 멈출 수 있어 바로 보낸다(같은 id 는 덮어쓰기라 두 번 가도 안전)
  if (REMOTE && outbox.length && navigator.sendBeacon){ try{ navigator.sendBeacon(REMOTE.url, new Blob([JSON.stringify({token:REMOTE.token, puts:outbox})],{type:"text/plain;charset=utf-8"})); }catch(e){} }
}
document.addEventListener("visibilitychange",()=>{ if(!S) return; if(document.hidden){ bankDay(); beaconOut(); } else S.lastTick = Date.now(); });

function next(){
  tick();
  if (S.activeMs >= 600000 || !S.queue.length) return finish();
  const e = S.queue.shift();
  if (e.t==="intro") return intro(e);
  ask(e);
}

function intro(e, back){
  const c = BY[e.card], t = today();
  const r = dayRec();
  if (!back && S.mode!=="cat" && r.answered>=6 && r.correct/r.answered < .5){ S.queue = S.queue.filter(x=>x.t!=="intro"); return next(); } // 정답이 절반 미만이면 새 카드 쉼
  CUR = e;
  $view.innerHTML = `
  <div class="wrap intro">
    <div class="qhead"><span class="chip">새 카드 · ${esc(CATS.find(x=>x.n===c.cat).name)}</span><span>${esc(c.mode)}</span></div>
    ${cardInfo(c)}
    <button class="big" id="ok">알겠어요</button>
    ${backBtn()}
  </div>`;
  bindBack();
  window.scrollTo(0,0);
  document.getElementById("ok").onclick = () => {
    remember(c.id);
    dirsOf(c).forEach(d=>{ const id=c.id+"."+d; items[id] = {...items[id], intro:t, box:1, due:SRS.addDays(t,1)}; saveItem(id); });
    // 설명 → 1장 뒤 키→뜻, 약 3장 뒤 할 일→키 (새 카드는 오늘 2번 맞혀야 끝) · 한 방향 카드는 1장 뒤 한 문제
    if (!c.one) S.queue.splice(Math.min(1,S.queue.length),0,{t:"q",item:c.id+".k",need:2,attempt:1,practice:false});
    S.queue.splice(Math.min(c.one?1:3,S.queue.length),0,{t:"q",item:c.id+".f",need:2,attempt:1,practice:false});
    next();
  };
  VOICE.listen({ next: document.getElementById("ok"), hint: "🎤 듣는 중 — 다 읽으셨으면 「알겠어」라고 말해 주세요" });
}

function options(c, dir){ // 헷갈리는 이웃 → 같은 분류 → 같은 종류 → 나머지. 보이는 글이 겹치지 않게.
  const label = id => dir==="k" ? BY[id].ko : tokText(BY[id]);
  const out = [c.id], seen = new Set([label(c.id)]);
  const add = id => { if (out.length>=4 || !BY[id] || out.includes(id)) return; const L = label(id); if (seen.has(L)) return; seen.add(L); out.push(id); };
  shuffle(c.near||[]).forEach(add);
  shuffle(CARDS.filter(x=>x.cat===c.cat).map(x=>x.id)).forEach(add);
  shuffle(CARDS.filter(x=>kindOf(x)===kindOf(c)).map(x=>x.id)).forEach(add);
  shuffle(CARDS.map(x=>x.id)).forEach(add);
  return shuffle(out);
}

/* 눌러서 맞히기 — 할 일→키 카드가 상자 3 이상이면(4지로 2번 넘게 맞힌 뒤) 키를 직접 조립. 상자 5부터는 메뉴 고르기까지. */
const canAsm = c => (kindOf(c)==="key" || kindOf(c)==="mouse") && c.keys.length>=2 && c.keys.slice(0,-1).every(k=>MODS.includes(k));
function asmLevel(e,c){
  if (!e.item.endsWith(".f") || !canAsm(c)) return 0;
  const b = items[e.item].box;
  if (b>=5 && c.then) return 2;
  return b>=3 ? 1 : 0;
}
const chipText = e => S.mode==="wrong" ? "틀린 것 복습" : S.mode==="cat" ? "분류 연습" : e.practice ? "한 번 더" : e.item.endsWith(".k") ? "키 → 뜻" : BY[e.item.split(".")[0]].cat===WORD_CAT ? "쓰임 → 영어 이름" : BY[e.item.split(".")[0]].cat===PICK_CAT ? "시험 → 키" : "할 일 → 키";

function ask(e){
  const [cid, dir] = e.item.split("."), c = BY[cid];
  CUR = e;
  const lv = asmLevel(e,c);
  if (lv) return askAsm(e,c,lv);
  const opts = e.opts ||= options(c, dir);
  const prompt = dir==="k"
    ? `<div class="prompt">${tokHtml(c,"huge")}<div class="ask">${ASK_K[kindOf(c)]}</div></div>`
    : `<div class="prompt"><div class="ask" style="font-size:1.35em">${esc(c.task)}</div>${c.cat===WORD_CAT?`<div class="ask">블렌더 화면에선 영어로 뭐라고 써 있나요?</div>`:""}</div>`;
  const choice = (id,i) => dir==="k"
    ? `<button class="choice" data-id="${id}"><span class="no" aria-hidden="true">${i+1}</span><span>${esc(BY[id].ko)}</span></button>`
    : `<button class="choice" data-id="${id}"><span class="no" aria-hidden="true">${i+1}</span>${tokHtml(BY[id],"mid")}</button>`;
  const left = S.queue.filter(x=>x.t==="q").length;
  $view.innerHTML = `
  <div class="wrap">
    <div class="qhead"><span class="chip">${chipText(e)}</span><span>${esc(c.mode)} · 남은 문제 ${left}</span></div>
    ${prompt}
    <div class="choices">${opts.map(choice).join("")}</div>
    <button class="ghost" id="idk">모르겠어요 → 정답 보기</button>
    ${backBtn()}
  </div>`;
  bindBack();
  window.scrollTo(0,0);
  $view.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const pick = b.dataset.id, ok = pick===c.id;
    $view.querySelectorAll(".choice").forEach(x=>{ x.disabled=true; if(x.dataset.id===c.id) x.classList.add("right"); else if(x.dataset.id===pick) x.classList.add("wrongpick"); });
    const wl = ok ? "" : `<p>고르신 ${dir==="k" ? `「${esc(BY[pick].ko)}」는 ${tokHtml(BY[pick])} 예요.` : `${tokHtml(BY[pick])} 는 「${esc(BY[pick].ko)}」예요.`}</p>`;
    settle(e,c,ok,wl);
  });
  document.getElementById("idk").onclick = ()=>{ $view.querySelectorAll(".choice").forEach(x=>{ x.disabled=true; if(x.dataset.id===c.id) x.classList.add("right"); }); settle(e,c,false,""); };
  VOICE.listen({
    choices: [...$view.querySelectorAll(".choice")].map(b => { const o = BY[b.dataset.id];
      const forms = dir==="k" ? [VOICE.norm(o.ko)] : [VOICE.norm(tokText(o)).replace(/키/g,""), VOICE.norm(o.keys.join(" ")).replace(/키/g,"")];
      return {el:b, forms:[...new Set(forms.filter(Boolean))]}; }),
    idk: document.getElementById("idk"),
    hint: "🎤 듣는 중 — 「1번」처럼 번호나 보기 글을 말해 주세요 · 「모르겠어」도 돼요" });
}

function askAsm(e,c,lv){
  const last = c.keys[c.keys.length-1];
  const pool = kindOf(c)==="mouse" ? MOUSE_FINALS : KEY_FINALS;
  const lets = e.lets ||= shuffle(uniq([last, ...shuffle(pool.filter(x=>x!==last)).slice(0,3)]));
  const thens = lv===2 ? (e.thens ||= shuffle(uniq([c.then, ...shuffle(THENS.filter(x=>x!==c.then)).slice(0,3)]))) : [];
  const sel = {mods:new Set(), l:null, t:null};
  const left = S.queue.filter(x=>x.t==="q").length;
  $view.innerHTML = `
  <div class="wrap">
    <div class="qhead"><span class="chip">눌러서 맞히기</span><span>${esc(c.mode)} · 남은 문제 ${left}</span></div>
    <div class="prompt"><div class="ask" style="font-size:1.35em">${esc(c.task)}</div></div>
    <div class="asm">
      <div class="asl">① 같이 누르는 키 (없으면 안 골라도 돼요)</div>
      <div class="mods">${MODS.map(m=>`<button class="mk" data-m="${m}" aria-pressed="false"><kbd>${m}</kbd></button>`).join("")}</div>
      <div class="asl">② 마지막 키</div>
      <div class="lets">${lets.map(l=>`<button class="lk" data-l="${esc(l)}"><kbd>${esc(l)}</kbd></button>`).join("")}</div>
      ${lv===2 ? `<div class="asl">③ 메뉴에서 고를 것</div><div class="lets">${thens.map(t=>`<button class="tk" data-t="${esc(t)}"><span class="pick">${esc(t)}</span></button>`).join("")}</div>`
        : c.then ? `<p class="asl">③ 메뉴가 뜨면 <span class="pick">${esc(c.then)}</span> 를 고르면 돼요</p>` : ""}
      <div class="built" id="built">고른 키가 여기 보여요</div>
    </div>
    <button class="big" id="chk" disabled>이렇게 누를래요</button>
    <button class="ghost" id="idk">모르겠어요 → 정답 보기</button>
    ${backBtn()}
  </div>`;
  bindBack();
  window.scrollTo(0,0);
  const built = document.getElementById("built"), chk = document.getElementById("chk");
  const pressed = () => [...MODS.filter(m=>sel.mods.has(m)), sel.l].filter(Boolean);
  const draw = () => {
    const ks = pressed();
    built.innerHTML = ks.length ? `<span class="tok">${keysHtml(ks)}${sel.t?`<span class="then"><em>→</em><span class="pick">${esc(sel.t)}</span></span>`:""}</span>` : "고른 키가 여기 보여요";
    chk.disabled = !(sel.l && (lv<2 || sel.t));
  };
  $view.querySelectorAll(".mk").forEach(b=>b.onclick=()=>{ const m=b.dataset.m; sel.mods.has(m)?sel.mods.delete(m):sel.mods.add(m); b.classList.toggle("on",sel.mods.has(m)); b.setAttribute("aria-pressed",String(sel.mods.has(m))); draw(); });
  $view.querySelectorAll(".lk").forEach(b=>b.onclick=()=>{ sel.l=b.dataset.l; $view.querySelectorAll(".lk").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
  $view.querySelectorAll(".tk").forEach(b=>b.onclick=()=>{ sel.t=b.dataset.t; $view.querySelectorAll(".tk").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
  const lock = () => { $view.querySelectorAll(".mk,.lk,.tk").forEach(x=>{ x.disabled=true; }); chk.remove(); };
  chk.onclick = () => {
    const want = c.keys.slice(0,-1);
    const ok = want.length===sel.mods.size && want.every(m=>sel.mods.has(m)) && sel.l===last && (lv<2 || sel.t===c.then);
    const mine = `<span class="tok">${keysHtml(pressed())}${sel.t?`<span class="then"><em>→</em><span class="pick">${esc(sel.t)}</span></span>`:""}</span>`;
    lock(); settle(e,c,ok, ok ? "" : `<p>누르신 것: ${mine}</p>`);
  };
  document.getElementById("idk").onclick = ()=>{ lock(); settle(e,c,false,""); };
  VOICE.listen(null); // 키 조립은 손으로 (2026-11-14 결정)
}

function settle(e,c,ok,wrongLine){
  const t = today();
  ["idk","bk","chk"].forEach(id=>{ const el=document.getElementById(id); if(el) el.remove(); });
  remember(c.id); e.opts = null; e.lets = null; e.thens = null;
  // 기록 — 뒤로 가서 이 카드 답을 보고 맞혔으면 일정에 안 넣고 나중에 한 번 더
  const peeked = e.peeked && ok; e.peeked = false;
  if (!e.practice && !peeked){ items[e.item] = SRS.grade(items[e.item], ok, t); saveItem(e.item); }
  const r = dayRec(); r.answered++; if(ok) r.correct++; else if(!r.wrongs.includes(e.item)) r.wrongs.push(e.item);
  S.answered++; if(ok) S.correct++; else S.wrongSet.add(e.item);
  bankDay();
  // 회차 안 다시 내기
  e.attempt++; if (ok && !peeked) e.need--; else e.need = Math.max(e.need,1);
  if (e.need>0) S.queue = SRS.reinsert(S.queue, e);
  const fam = famsOf(c.id)[0];
  const fb = document.createElement("div");
  fb.className = "fb " + (ok?"ok":"again");
  fb.innerHTML = `
    <div class="head">${peeked ? "맞아요 · 설명 보고 맞힌 거라 나중에 한 번 더 나와요" : ok ? "맞아요" : "다시 나올 카드로 보냈어요"}</div>
    <p>${tokHtml(c)} = <b>${esc(c.ko)}</b> <span class="en">${esc(c.en)}</span></p>
    ${wrongLine}
    ${menuHtml(c)}
    ${c.one ? `<p><b>${esc(c.why)}</b></p><p class="why">${esc(c.origin)}</p>` : `<p class="why">${esc(c.origin)} · ${esc(c.why)}</p>`}
    ${fam ? `<p class="why">가족: <b>${esc(fam.title)}</b></p>` : ""}
    <button class="big" id="nx">다음</button>`;
  $view.querySelector(".wrap").appendChild(fb);
  document.getElementById("nx").onclick = ()=>{ next(); };
  document.getElementById("nx").focus({preventScroll:true});
  ok ? SOUND.ok() : SOUND.no();
  VOICE.listen({ next: document.getElementById("nx"), hint: "🎤 듣는 중 — 「다음」이라고 말하면 넘어가요" });
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function finish(){
  bankDay();
  const r = dayRec();
  const mins = Math.max(1, Math.round(S.activeMs/60000));
  const wrongToday = (r.wrongs||[]).slice();
  const left = S.queue.filter(x=>x.t==="q"||x.t==="intro").length;
  const cat = S.mode==="cat" ? S.cat : null;
  $view.innerHTML = `
  <div class="wrap">
    <h1>${left ? "10분 됐어요. 오늘은 여기까지 해도 좋아요" : cat ? "이 분류 다 했어요" : "오늘 할 것 다 했어요"}</h1>
    <div class="stats">
      <div class="stat"><b>${mins}분</b><span>이번 연습</span></div>
      <div class="stat"><b>${S.answered}</b><span>푼 문제</span></div>
      <div class="stat"><b>${S.correct}</b><span>맞힘</span></div>
    </div>
    <p class="note">오늘 처음 본 카드는 <b>내일</b> 다시 나와요. 하루 뒤엔 차이가 잘 안 느껴져도, 날을 띄워 꺼내 본 것은 한 달 뒤에 차이가 나요.</p>
    ${cat ? `<button class="big" id="again">이 분류 한 번 더</button>` : `<button class="big" id="more">더 하기 (10분)</button>`}
    <button class="big alt" id="wr" ${wrongToday.length?"":"disabled"}>틀린 것 복습 (${wrongToday.length}문제)</button>
    <button class="ghost" id="hm">처음 화면으로</button>
  </div>`;
  S.activeMs = 0; S.bankedS = 0;
  const m = document.getElementById("more"), a = document.getElementById("again");
  if (m) m.onclick = startMore;
  if (a) a.onclick = ()=>startCat(cat);
  document.getElementById("wr").onclick = ()=>startWrong(wrongToday);
  document.getElementById("hm").onclick = home;
  window.scrollTo(0,0);
}
window.addEventListener("pagehide", ()=>{
  if(S){ bankDay(); S.activeMs=0; S.bankedS=0; }
  beaconOut();
});

/* 새 판 저절로 받기 (11-15 「폰에 내용이 안 바뀌였던데?」 — 폰 브라우저가 옛 페이지를 들고 있었음) — 공개만들기.mjs 가 BUILD 를 채움.
   열 때·다시 볼 때 새 주소로 페이지를 몰래 받아 BUILD 가 다르면 바꿔 끼움. 문제 푸는 중(S)엔 안 끊음 — 처음 화면으로 오면 그때. */
const BUILD = "745dd92a23";
async function checkBuild(){
  if (!BUILD || S) return;
  try{
    const h = await (await fetch(location.pathname+"?b="+Date.now(), {cache:"no-store"})).text();
    const m = h.match(/const BUILD = "([0-9a-f]+)"/);
    if (m && m[1]!==BUILD && !S) location.replace(location.pathname+"?v="+m[1]+location.hash);
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkBuild(); });

load().then(()=>{ home(); checkBuild(); });
</script>
